<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styleCad.css">
    <script src="../js/agendamentoAtualizar.js" defer></script>
    <title>Atualizar Agendamento</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Agendamento</h1>
        <form>
            <label for="id">Código do Agendamento</label><br>
            <input type="number" id="id" required><br><br>

            <label for="data">Data</label><br>
            <input type="date" id="data"><br><br>

            <label for="hora">Hora</label><br>
            <input type="time" id="hora"><br><br>

            <label for="idBicicleta">Código da Bicicleta</label><br>
            <input type="number" id="idBicicleta"><br><br>

            <label for="idCiclista">Código do Ciclista</label><br>
            <input type="number" id="idCiclista"><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
