<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styleCad.css">
    <script src="../js/bicicletaCad.js" defer></script>
    <title>Cadastro de Bicicleta</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Bicicleta</h1>
        <form>
            <label for="modelo">Modelo</label><br>
            <input type="text" id="modelo" required><br><br>

            <label for="tipo">Tipo (ex: Urbana, Mountain Bike, Speed)</label><br>
            <input type="text" id="tipo" required><br><br>

            <label for="aro">Aro</label><br>
            <input type="number" id="aro" required><br><br>

            <label for="idCiclista">Código do Ciclista (Dono)</label><br>
            <input type="number" id="idCiclista" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
