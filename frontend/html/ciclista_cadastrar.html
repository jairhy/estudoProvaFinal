<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styleCad.css">
    <script src="../js/ciclistaCad.js" defer></script>
    <title>Cadastro de Ciclista</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Ciclista</h1>
        <form>
            <label for="nome">Nome Completo</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>

            <label for="senha">Senha</label><br>
            <input type="password" id="senha" required><br><br>

            <label for="cpf">CPF (apenas 11 números)</label><br>
            <input type="text" id="cpf" maxlength="11" required><br><br>

            <label for="endereco">Endereço</label><br>
            <input type="text" id="endereco" required><br><br>

            <label for="celular">Celular</label><br>
            <input type="text" id="celular" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
